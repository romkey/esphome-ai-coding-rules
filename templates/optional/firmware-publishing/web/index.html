<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REPO installer</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10.4.0/dist/web/install-button.js?module"></script>
  <style>
    :root { color-scheme: light dark; --fg: #1b1f24; --bg: #ffffff; --muted: #59636e; --accent: #18bcf2; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --bg: #0d1117; --muted: #9198a1; } }
    body { font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg);
           max-width: 40rem; margin: 0 auto; padding: 2rem 1rem; }
    p { color: var(--muted); }
    li { margin: 1rem 0; list-style: none; }
    esp-web-install-button button { background: var(--accent); color: #fff; border: 0;
           border-radius: 6px; padding: .6rem 1rem; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <h1>REPO</h1>
  <p>Connect the board over USB and choose it below. Works in Chrome and Edge
     on desktop. After flashing you'll be asked for your Wi-Fi network.</p>
  <ul id="devices"><li>Loading…</li></ul>
  <p><a href="https://github.com/romkey/REPO">Source and documentation</a></p>
  <script>
    // firmware/index.json is generated by the release workflow.
    fetch("firmware/index.json")
      .then((r) => r.json())
      .then((items) => {
        const list = document.getElementById("devices");
        list.replaceChildren(...items.map(({ name, manifest }) => {
          const li = document.createElement("li");
          const button = document.createElement("esp-web-install-button");
          button.setAttribute("manifest", "firmware/" + manifest);
          const label = document.createElement("button");
          label.slot = "activate";
          label.textContent = "Install " + name;
          button.append(label);
          li.append(button);
          return li;
        }));
      })
      .catch(() => {
        document.getElementById("devices").textContent = "No firmware published yet.";
      });
  </script>
</body>
</html>
