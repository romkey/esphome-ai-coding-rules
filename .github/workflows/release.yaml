name: Release

# Push a tag vX.Y.Z; see docs/releasing.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check changelog and plugin version
        run: |
          version="${GITHUB_REF_NAME#v}"
          templates/scripts/changelog-section.sh "$version" > "$RUNNER_TEMP/notes.md"
          # The plugin version pins what Claude Code users get.
          plugin=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$plugin" != "$version" ]; then
            echo "::error::.claude-plugin/plugin.json version is $plugin, tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" $prerelease
