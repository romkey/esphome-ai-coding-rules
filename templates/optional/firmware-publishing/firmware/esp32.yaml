# Published firmware for an ESP32 DevKit. Contains no secrets; see
# optional/firmware-publishing/README.md in esphome-ai-coding-rules.

substitutions:
  # Lowercase letters, digits and hyphens; usually the repo name.
  name: example-device
  friendly_name: REPO
  # Must match the release tag without the "v"; the release workflow checks.
  project_version: "0.1.0"
  status_led_pin: GPIO4

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Unique hostnames when several devices run the same image.
  name_add_mac_suffix: true
  project:
    name: romkey.REPO
    version: ${project_version}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

packages:
  example: !include ../packages/example.yaml
  status_led: !include ../packages/status-led.yaml
  esp32: github://romkey/esphome-lib/lib/esp32.yml@v0.2.0
  wifi_diagnostics: github://romkey/esphome-lib/lib/wifi-diagnostics.yml@v0.2.0
  restart: github://romkey/esphome-lib/lib/restart.yml@v0.2.0

logger:

# The key is provisioned at runtime when the device is adopted.
api:
  encryption:

ota:
  - platform: esphome

# Lets ESPHome/Home Assistant adopt the device and track this config.
dashboard_import:
  package_import_url: github://romkey/REPO/firmware/esp32.yaml@main
  import_full_config: false

# No credentials. After flashing, people set up their own Wi-Fi with any of:
# - the web installer, which asks for it over USB (Improv serial);
# - a phone over Bluetooth: the Home Assistant app finds the device, or use
#   https://www.improv-wifi.com in Chrome (Improv BLE);
# - the fallback hotspot's captive portal.
# ESPHome doesn't support ESP RainMaker; Improv is its equivalent.
wifi:
  ap:

captive_portal:

improv_serial:

# Needs a chip with Bluetooth (not the ESP32-S2). No authorizer button, since
# boards differ; the provisioning window below limits the exposure. If the
# board has a button, use it: authorizer: <binary_sensor id>.
# ESPHome 2026.10 renames this improv_ble; switch once 2026.10 is the stable
# release. The old name stops working in ESPHome 2027.4.0.
esp32_improv:
  authorizer: none

# Setup window: if Wi-Fi isn't set up and the device isn't adopted by Home
# Assistant within 30 minutes of power-on, Improv, the hotspot and adoption
# stop accepting connections until the device is unplugged and replugged.
# An unconfigured device otherwise stays open to anyone nearby. ESPHome warns
# that the hotspot closes with the window; that's intended here.
provisioning:
  timeout: 30min

button:
  - platform: safe_mode
    name: "Safe Mode Boot"
    entity_category: config
