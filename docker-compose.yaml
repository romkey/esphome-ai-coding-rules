# Lint this repo without installing anything:
#
#   docker compose run --rm lint
#   docker compose run --rm secrets    # scan the git history for secrets
#
# To build and validate the templates, use their own compose file:
#
#   cp templates/examples/secrets.yaml.example templates/examples/secrets.yaml
#   docker compose -f templates/docker-compose.yaml run --rm build

services:
  # Runs .pre-commit-config.yaml: yamllint, actionlint, clang-format, ruff...
  lint:
    build:
      dockerfile_inline: |
        FROM ghcr.io/astral-sh/uv:0.13.1-python3.13-trixie-slim
        RUN apt-get update \
         && apt-get install -y --no-install-recommends git \
         && rm -rf /var/lib/apt/lists/* \
         && git config --system --add safe.directory '*'
    volumes:
      - .:/project
      - lint-cache:/root/.cache
    working_dir: /project
    command: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure

  # Scans every commit in the git history for secrets, like CI does.
  secrets:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    volumes:
      - .:/project
    command: git /project --redact --verbose

volumes:
  lint-cache:
