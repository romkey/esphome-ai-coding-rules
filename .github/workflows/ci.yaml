# GENERATED by scripts/sync-ci.py from templates/.github/workflows/ci.yaml.
# Edit the template, then run scripts/sync-ci.py. Builds templates/.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:
  schedule:
    # Weekly: catches stable releases that break the build, and builds
    # against ESPHome beta as an early warning.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Empty means latest stable. Pin with a repository variable, e.g. 2026.9.1.
  ESPHOME_VERSION: ${{ vars.ESPHOME_VERSION }}
  CCACHE_MAXSIZE: 500M

defaults:
  run:
    working-directory: templates

jobs:
  configs:
    name: Find configs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.find.outputs.list }}
      channels: ${{ steps.find.outputs.channels }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          echo "list=$(scripts/list-configs.sh --json)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'channels=["stable","beta"]' >> "$GITHUB_OUTPUT"
          else
            echo 'channels=["stable"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.config }} (${{ matrix.channel }})
    needs: configs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A beta failure is an early warning, not a broken build.
    continue-on-error: ${{ matrix.channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.configs.outputs.list) }}
        channel: ${{ fromJSON(needs.configs.outputs.channels) }}
    steps:
      - uses: actions/checkout@v7

      # Native ESPHome via uv installs in seconds; pulling the Docker image
      # takes longer and makes cache directories root-owned.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/ci.yaml
          # Matrix jobs share one uv cache; let only the first save it.
          save-cache: ${{ strategy.job-index == 0 }}

      - name: Install ESPHome and ccache
        id: esphome
        env:
          CHANNEL: ${{ matrix.channel }}
          SRC_HASH: >-
            ${{ hashFiles('templates/examples/**', 'templates/firmware/**',
            'templates/packages/**', 'templates/components/**') }}
        run: |
          if [ "$CHANNEL" = beta ]; then
            uv tool install --prerelease allow esphome
          else
            uv tool install "esphome${ESPHOME_VERSION:+==$ESPHOME_VERSION}"
          fi
          # ESPHome uses ccache automatically when it is on PATH.
          sudo apt-get install -y --no-install-recommends ccache \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ccache; }
          echo "version=$(esphome version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
          echo "src=$SRC_HASH" >> "$GITHUB_OUTPUT"
          echo "ESPHOME_BUILD_PATH=$HOME/esphome-build" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/ccache" >> "$GITHUB_ENV"
          cp examples/secrets.yaml.example examples/secrets.yaml

      # Toolchains only change with the ESPHome version, so this key rarely
      # changes and the cache is saved rarely.
      - name: Cache toolchains
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: toolchains-${{ matrix.config }}-${{ steps.esphome.outputs.version }}
          restore-keys: toolchains-${{ matrix.config }}-

      # Build tree + ccache make rebuilds incremental. Saved whenever sources
      # change; restores the newest previous build for this config.
      - name: Cache build
        uses: actions/cache@v6
        with:
          path: |
            ~/esphome-build
            ~/ccache
          key: build-${{ matrix.config }}-${{ steps.esphome.outputs.version }}-${{ steps.esphome.outputs.src }}
          restore-keys: |
            build-${{ matrix.config }}-${{ steps.esphome.outputs.version }}-
            build-${{ matrix.config }}-

      - name: esphome config
        run: esphome config "${{ matrix.config }}"

      - name: esphome compile
        # The PlatformIO registry is occasionally flaky; retry before failing.
        run: |
          for attempt in 1 2 3; do
            esphome compile "${{ matrix.config }}" && exit 0
            echo "::warning::compile attempt $attempt failed"
            sleep 15
          done
          exit 1

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.present == 'true'
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: templates/tests/requirements.txt
      - if: steps.check.outputs.present == 'true'
        run: |
          if [ -f tests/requirements.txt ]; then
            uvx --with-requirements tests/requirements.txt pytest@9.1.1 tests
          else
            uvx pytest@9.1.1 tests
          fi
